; Copie este arquivo para "config.ini" (mesma pasta) e ajuste os valores.
; config.ini NÃO deve ir pro Git (tem o token secreto) — já está no .gitignore.

[api]
; URL do backend no Railway (sem barra no final)
base_url = https://backend-production-75531.up.railway.app

; Mesmo valor configurado na variável PRINT_AGENT_TOKEN no Railway.
; Gere um novo com: python -c "import secrets; print(secrets.token_hex(32))"
agent_token = COLOQUE_AQUI_O_MESMO_TOKEN_DO_RAILWAY

; A cada quantos segundos o agente consulta /impressao/pendentes
poll_interval_segundos = 10

[impressora]
; Nome EXATO da impressora como aparece em
; Painel de Controle > Dispositivos e Impressoras (ex: "MP-2500 TH").
; Rode "python agent.py --listar-impressoras" para ver os nomes exatos.
nome = MP-2500 TH

; 41 colunas = papel 58mm na Bematech (mesmo valor já usado em print_comanda.php)
colunas = 41

[empresa]
nome = SORVETES GELATTO MANNIA
endereco = Rua Guarani, 191 - Corumbataí do Sul - PR
telefone = (44) 9.9826-4006

[log]
; Caminho do arquivo de log. Por padrão, uma pasta "logs" ao lado deste arquivo.
arquivo = logs/agente_impressao.log
nivel = INFO
